<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>Post Detail - My Blog</title>
    <script src="/static/js/auth.js"></script>

    <style>
        body {
            width: 500px;
            margin: 40px auto;
            font-family: sans-serif;
        }

        button {
            margin: 5px;
        }

        .post-meta {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 20px;
        }

        .post-content {
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .nav-links {
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div id="nav" class="nav-links">
        <button onclick="goHome()">Home</button>
    </div>

    <h1 id="title">読み込み中...</h1>
    <div class="post-meta">
        <span>投稿日: <span id="created_at">-</span></span>
        <span>投稿者: <a id="author">-</a></span>
    </div>

    <div class="post-content" id="content">
        文章を読み込んでいます...
    </div>

    <div id="action-buttons"></div>

    <script>
        function goHome() {
            location.href = "/";
        }

        function goEdit(postId) {
            location.href = `/posts/${postId}/edit`;
        }

        const pathSegments = window.location.pathname.split("/");
        const postId = pathSegments[pathSegments.length - 1];

        const token = localStorage.getItem("token");

        async function fetchPostDetail() {
            if (!postId) {
                document.getElementById("title").textContent = "記事が見つかりません";
                document.getElementById("content").textContent = "";
                return;
            }

            try {
                const response = await fetch(`/api/posts/${postId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP エラー! status: ${response.status}`);
                }

                const resData = await response.json();
                const post = resData.post;
                const date = new Date(post.created_at);

                document.getElementById("title").textContent = post.title;
                document.getElementById("created_at").textContent =
                    date.toLocaleDateString("ja-JP", {
                        year: "numeric",
                        month: "2-digit",
                        day: "2-digit",
                        hour: "2-digit",
                        minute: "2-digit"
                    });
                document.getElementById("author").textContent = post.display_name;
                document.getElementById("author").href = `/users/${post.user_id}`
                document.getElementById("content").textContent = post.content;

                if (token) {
                    document.getElementById("action-buttons").innerHTML = `
                <button onclick="goEdit('${resData.post.id}')">Edit Post</button>
                <button onclick="deletePost('${resData.post.id}')">Delete Post</button>
            `;
                }
            } catch (error) {
                console.error("Error fetching post:", error);
                document.getElementById("title").textContent = "エラーが発生しました";
            }
        }

        async function deletePost(id) {
            if (confirm("本当にこの記事を削除しますか？")) {
                try {
                    const response = await apiFetch(`/api/posts/${id}`, {
                        method: 'DELETE'
                    });

                    if (!response.ok) {
                        let errorMsg = "削除できませんでした";
                        try {
                            const errData = await response.json();
                            if (errData["エラー"]) {
                                errorMsg = errData["エラー"];
                            }
                        } catch (e) {

                        }
                        throw new Error(errorMsg)
                    }

                    const resData = await response.json();
                    alert(resData["メッセージ"] || "削除しました");
                    goHome();
                } catch (error) {
                    console.error("エラー:", error);
                    alert(error.message);
                }
            }
        }

        fetchPostDetail();

    </script>

</body>

</html>
