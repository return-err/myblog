services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    # container_name: myblog-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    environment:
      JWT_SECRET: ${JWT_SECRET:?}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_NAME: ${DB_NAME:?}
      INITIAL_ADMIN_USER: ${INITIAL_ADMIN_USER:?}
      INITIAL_ADMIN_PASS: ${INITIAL_ADMIN_PASS:?}
      TLS_CERT_FILE: /certs/localhost.pem
      TLS_KEY_FILE: /certs/localhost-key.pem
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:18-alpine
    # container_name: local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: ${DB_NAME:?}
    # ports:
    #   - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  pgdata:
